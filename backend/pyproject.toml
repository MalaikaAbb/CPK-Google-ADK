[project]
name = "copilotkit-google-adk-testsuite-backend"
version = "0.1.0"
description = "ADK agent server for the CopilotKit + Google ADK test suite"
requires-python = ">=3.10"

# The Quickstart's install line, verbatim:
#   uv add ag-ui-adk google-adk uvicorn fastapi
dependencies = [
    "ag-ui-adk>=0.7.0",
    "google-adk>=1.28.1",
    "uvicorn>=0.35.0",
    "fastapi>=0.115.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
